version: 2

sources:
  - name: raw
    database: NYC_TLC
    schema: RAW
    description: "Raw NYC TLC data landed by ingestion/load_raw.py."
    tables:
      - name: yellow_tripdata_raw
        description: "Yellow taxi trips — schema-on-read VARIANT landing (one record per trip)."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
      - name: taxi_zone_lookup
        description: "TLC taxi zone lookup — typed (locationid, borough, zone, service_zone)."
